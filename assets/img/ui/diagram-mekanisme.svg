<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 404 92" width="404" height="92" role="img" aria-label="23 sensor lain masuk ke RINTIK menghasilkan estimasi %RH; sensor humidity tidak masuk model dan hanya dibandingkan dengan estimasi" fill="none" font-family="Inter,system-ui,sans-serif">
<defs><marker id="dm-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#0F55B8"/></marker><marker id="dm-b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#6B7C92"/></marker></defs>
<rect x="1" y="8" width="92" height="30" rx="8" stroke="#0F55B8" stroke-width="1.5" fill="#fff"/>
<text x="47" y="27" text-anchor="middle" font-size="12" font-weight="600" fill="#131E30">23 sensor lain</text>
