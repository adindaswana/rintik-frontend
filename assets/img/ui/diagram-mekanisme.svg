<text x="340" y="27" text-anchor="middle" font-size="12" font-weight="600" fill="#131E30">%RH per 30 menit</text>
<rect x="1" y="56" width="128" height="30" rx="8" stroke="#6B7C92" stroke-width="1.5" stroke-dasharray="4 3" fill="#fff"/>
<text x="65" y="75" text-anchor="middle" font-size="12" font-weight="600" fill="#3B4A5E">Sensor humidity</text>
